<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动端第一关键：没有这一行，手机会按 980px 桌面视口渲染再整体缩小，排版必然错位 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#ffffff">
<title>Ai 女友专区</title>
<style>
  :root{
    --blue:#409eff;
    --green:#67c23a;
    --pink:#ff5f96;
    --pink-light:#ffd0e0;
    --text:#1f2329;
    --sub:#5c6370;
    --line:#ecedf0;
    --gap:16px;
    --radius:12px;
  }

  /* ===== 基础：盒模型 + 文字缩放 + 防横向溢出 ===== */
  *,*::before,*::after{ box-sizing:border-box; }
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    margin:0;
    padding:20px var(--gap) 28px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.75;
    color:var(--text);
    background:#fff;
    overflow-x:hidden;                 /* 兜底，防止任何子元素把页面撑出横向滚动 */
    overflow-wrap:anywhere;            /* 长英文链接不再撑破布局 */
    word-break:break-word;
    -webkit-tap-highlight-color:transparent;
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    body{ padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
  }
  /* 图片永远不超出容器 */
  img{ max-width:100%; height:auto; display:block; border:0; }
  p{ margin:0 0 10px; }
  .wrap{ max-width:640px; margin:0 auto; }

  /* ===== 顶部标题 ===== */
  .title{
    font-size:20px;                    /* 旧内核兜底 */
    font-size:clamp(19px,5.4vw,26px);
    line-height:1.4;
    font-weight:800;
    text-align:center;
    margin:0 0 16px;
    letter-spacing:.2px;
  }

  /* 品牌行：图标 + 名称，窄屏自动换行，不再用 white-space:nowrap */
  .brand{
    display:flex;
    flex-wrap:wrap;                    /* 关键：空间不足换行而不是挤爆 */
    align-items:center;
    justify-content:center;
    gap:8px 10px;
    text-align:center;
    margin:0 0 18px;
  }
  .brand-icon,
  .brand-badge{
    height:40px;                       /* 旧内核兜底：clamp 失效时不会退化成原图巨高 */
    height:clamp(34px,10vw,64px);
    width:auto;
    max-width:100%;
    object-fit:contain;
    border-radius:6px;
    flex:0 0 auto;
  }
  .brand-name{
    font-size:15px;
    font-size:clamp(13.5px,4vw,20px);
    font-weight:800;
    line-height:1.4;
    flex:0 1 auto;
  }

  .lead{
    font-size:16px;
    font-size:clamp(15px,4.1vw,17px);
    font-weight:700;
    text-align:center;
    margin:0 0 14px;
  }

  /* 卖点：小屏单列、宽屏两列，不会挤成一坨 */
  .features{
    list-style:none;
    display:grid;
    grid-template-columns:1fr;         /* 手机：一行一条 */
    gap:8px;
    margin:0 0 18px;
    padding:0;
  }
  @media (min-width:480px){
    .features{ grid-template-columns:repeat(3,1fr); }
  }
  .features li{
    padding:8px 12px;
    background:#fff7fa;
    border:1px solid #ffe3ec;
    border-radius:10px;
    font-size:14px;
    font-size:clamp(13px,3.7vw,15px);
    line-height:1.55;
    color:#7a2f48;
    text-align:center;
  }

  /* 提示条 */
  .note{
    padding:10px 12px;
    margin:0 0 20px;
    background:#f5f7fa;
    border-left:3px solid var(--blue);
    border-radius:8px;
    font-size:13px;
    font-size:clamp(13px,3.6vw,14px);
    line-height:1.65;
    color:var(--sub);
  }

  .note-link{
    color:var(--blue);
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:10px 2px;                  /* 扩大点击热区，不撑高行距 */
    margin:-10px 0;
    -webkit-tap-highlight-color:rgba(64,158,255,.15);
  }

  /* ===== 卡片（原左右一行 flex 结构）===== */
  .card{
    display:flex;
    flex-wrap:wrap;                    /* 关键：窄屏自动换行 */
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    margin:0 0 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    box-shadow:0 1px 3px rgba(16,24,40,.05);
  }
  .card-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;                       /* 关键：flex 子项允许收缩，文字才会省略/换行 */
    flex:1 1 auto;
  }
  .card-icon{
    width:36px; height:36px;
    object-fit:cover;
    border-radius:8px;
    flex:0 0 auto;
  }
  .card-name{
    min-width:0;
    font-size:15px;
    font-size:clamp(14px,4.1vw,17px);
    font-weight:800;
    line-height:1.35;
    margin:0;
  }
  .card-actions{
    display:flex;
    gap:8px;
    flex:0 0 auto;
  }
  /* 手机竖屏：标题独占一行，两个按钮下一行并排各占一半，拇指好点 */
  @media (max-width:460px){
    .card{ gap:10px; }
    .card-info{ flex:1 1 100%; }
    .card-actions{ flex:1 1 100%; }
    .card-actions .btn{ flex:1 1 0; }
  }

  /* ===== 按钮：统一 a / button 的外观点击区 ===== */
  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:44px;                   /* 触控目标 ≥44px */
    padding:0 16px;
    border:0;
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    line-height:1.2;
    color:#fff;
    text-decoration:none;
    white-space:nowrap;
    overflow:hidden;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;                   /* 去掉 iOS 按钮默认样式 */
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform:scale(.97); filter:brightness(.94); }
  .btn-blue{ background:var(--blue); }
  .btn-green{ background:var(--green); }
  /* 流光：pointer-events:none，避免伪元素吃掉点击 */
  .btn::before{
    content:"";
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
    animation:stream 2.2s linear infinite;
    pointer-events:none;
  }
  @keyframes stream{
    0%{ left:-100%; }
    100%{ left:100%; }
  }

  /* ===== 流光文字：先给纯色，支持 background-clip 才做渐变 ===== */
  .shine{
    color:var(--pink);                 /* 不支持渐变裁剪时仍然看得见 */
    font-weight:800;
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .shine{
      background:linear-gradient(90deg,var(--pink) 0%,var(--pink-light) 50%,var(--pink) 100%);
      background-size:200% auto;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation:textShine 2.6s linear infinite;
    }
  }
  @keyframes textShine{
    0%{ background-position:0% center; }
    100%{ background-position:200% center; }
  }

  /* 尊重系统"减弱动态效果" */
  @media (prefers-reduced-motion:reduce){
    .btn::before,
    .shine{ animation:none; }
  }

  /* ===== 单例 toast ===== */
  .toast{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    max-width:80vw;
    padding:10px 18px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:14px;
    line-height:1.4;
    border-radius:8px;
    pointer-events:none;
    opacity:0;
    visibility:hidden;
    transition:opacity .18s ease;
    z-index:9999;
  }
  .toast.show{ opacity:1; visibility:visible; }

  /* ===== 复制失败时的手动复制弹层 ===== */
  .modal{
    position:fixed;
    top:0; right:0; bottom:0; left:0;   /* inset 的旧内核兜底 */
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,.45);
    z-index:10000;
  }
  .modal[hidden]{ display:none; }
  .modal-box{
    width:100%;
    max-width:340px;
    padding:18px;
    background:#fff;
    border-radius:14px;
  }
  .modal-box p{
    margin:0 0 10px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub);
  }
  .modal-box input{
    width:100%;
    padding:10px 12px;
    font-size:13px;
    font-family:inherit;
    color:var(--text);
    background:#f5f7fa;
    border:1px solid var(--line);
    border-radius:8px;
    margin:0 0 14px;
  }
  .modal-box .btn{ width:100%; }
</style>
</head>

  }

  // 现代 API（仅 https / localhost 可用）→ execCommand 兜底 → 手动弹层
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return legacyCopy(text);
      });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function showManual(text) {
    linkEl.value = text;
    modalEl.hidden = false;
    setTimeout(function () {
      linkEl.focus();
      linkEl.select();
    }, 30);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-copy]') : null;
    if (!btn) return;
    var text = btn.getAttribute('data-copy') || '';
    copyText(text).then(function (ok) {
      if (ok) showToast('复制链接成功');
      else showManual(text);
    });
  });

  document.getElementById('closeModal').addEventListener('click', function () {
    modalEl.hidden = true;
  });
  modalEl.addEventListener('click', function (e) {
    if (e.target === modalEl) modalEl.hidden = true;
  });
})();
</script>
</body>
</html>
